[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "laptimesim"
version = "0.1.0"
description = "High-fidelity modular lap time simulator for Formula Student and vehicle dynamics research"
authors = ["laptimesim contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "laptimesim"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
casadi = "^3.6.5"
numpy = "^1.26.0 || ^2.0.0"
scipy = "^1.11.0"
pydantic = "^2.6.0"
typer = {extras = ["all"], version = "^0.12.0"}
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
rich = "^13.7.0"
pandas = "^2.2.0"
matplotlib = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
laptimesim = "laptimesim.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
